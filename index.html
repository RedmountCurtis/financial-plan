    <p class="desc">Snapshots of the full assumption set (capital market assumptions, glide path, guardrails, retirement spending, What-If sliders) so you can compare named alternatives side by side without losing track of what produced which result.</p>

    <table>

    <table>
      <thead><tr><th>Generated</th><th>By</th><th>Success Rate</th><th>Median Ending Balance</th><th>Trials / Seed</th></tr></thead>

      </tbody>
    </table>` : '<div class="empty">No PDF reports generated for this client yet.</div>'}

  <div class="panel">
    <h2>Assumptions Audit Log</h2>
    <p class="desc">Tracks changes to assumptions, Social Security inputs, simulation trials, retirement age, and life expectancy — useful when a plan is shared across advisors. Field-level edits only (goal names, notes, etc. aren't logged).</p>

    <table>

      <tbody>
        ${auditLog.slice(0,25).map(a=>`<tr>
          <td style="font-size:12px; color:var(--ink-dim);">${fmtTs(a.ts)}</td>
          <td style="font-size:12px; color:var(--ink-dim);">${esc(a.user)}</td>

        </tr>`).join('')}
      </tbody>

  `;

// ==================== TAB: WHAT-IF / ELASTICITY ====================
function whatIfSlider(id, label, value, min, max, step, displayFn){
  return `
  <div class="slider-row">
    <div class="sr-head"><span>${label}</span><span class="sr-val" id="${id}Val">${displayFn(value)}</span></div>
    <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}" oninput="onWhatIfChange('${id}', this.value)">
  </div>`;
}

let whatIfSidebarDebounce = null;
function onWhatIfChange(id, val){
  val = parseFloat(val);
  if(id==='wiRetireAge') whatIf.retireAgeDelta = val;
  else if(id==='wiSpending') whatIf.spendingPct = val;
  else if(id==='wiSavings') whatIf.savingsPct = val;
  else if(id==='wiReturn') whatIf.returnDelta = val;
  // Live-update just the value labels + result panel, without a full re-render (keeps slider drag smooth).
  const labels = {wiRetireAge:(v)=> (v>=0?'+':'')+v+' yrs', wiSpending:(v)=>v+'%', wiSavings:(v)=>v+'%', wiReturn:(v)=>(v>=0?'+':'')+v+'%'};
  const lbl = $id(id+'Val'); if(lbl) lbl.textContent = labels[id](val);
  const plan = getPlan(activeId);
  const result = monteCarloResult(plan, whatIf, 400, {seed:(plan.monteCarlo&&plan.monteCarlo.seed)||42});
  const resultWrap = $id('whatIfResult');
  if(resultWrap) resultWrap.innerHTML = whatIfResultHTML(result);
  // The sidebar recomputes every client's success dot — debounce so a slider drag doesn't
  // re-run the full roster on every animation frame.
  clearTimeout(whatIfSidebarDebounce);
  whatIfSidebarDebounce = setTimeout(renderClientList, 200);
}

function whatIfResultHTML(result){
  if(result.trials===0) return '<div class="empty">Not enough data to project.</div>';
  const rate = result.successRate;
  const tone = rate>=80 ? 'good' : rate>=60 ? 'warn' : 'bad';
  const barColor = rate>=80 ? 'var(--good)' : rate>=60 ? 'var(--warn)' : 'var(--bad)';
  return `
    <div class="pos-meter">
      <div><div class="pos-num ${tone}">${rate}%</div><div class="pos-label">Probability of Success</div></div>
      <div class="pos-track"><div class="pos-fill" style="width:${rate}%; background:${barColor};"></div></div>
    </div>
    <div style="margin-top:10px; font-size:12.5px; color:var(--ink-dim);">Median ending balance: ${fmt$(result.medianEndingBalance)}</div>
  `;
}

function resetWhatIf(){
  whatIf = {retireAgeDelta:0, spendingPct:100, savingsPct:100, returnDelta:0};
  renderTab();
}

function whatIfTabHTML(plan){
  const baseline = monteCarloResult(plan, {retireAgeDelta:0, spendingPct:100, savingsPct:100, returnDelta:0}, 400, {seed:(plan.monteCarlo&&plan.monteCarlo.seed)||42});
  const current = monteCarloResult(plan, whatIf, 400, {seed:(plan.monteCarlo&&plan.monteCarlo.seed)||42});
  return `
  <div class="panel">
    <h2>What-If / Elasticity Testing</h2>
    <p class="desc">Drag the levers to see how retirement age, spending, savings, and expected return move the probability of success — this is the client-facing "play zone" conversation. Changes here don't get saved to the plan; they're for live discussion. Use the Household/Cash Flow/Assumptions tabs to actually change the plan's baseline.</p>
    <div class="row">
      <div style="flex:1; min-width:280px;">
        ${whatIfSlider('wiRetireAge','Retirement age', whatIf.retireAgeDelta, -10, 10, 1, v=>(v>=0?'+':'')+v+' yrs')}
        ${whatIfSlider('wiSpending','Retirement spending', whatIf.spendingPct, 60, 140, 5, v=>v+'%')}
        ${whatIfSlider('wiSavings','Pre-retirement savings rate', whatIf.savingsPct, 0, 200, 5, v=>v+'%')}
        ${whatIfSlider('wiReturn','Expected return adjustment', whatIf.returnDelta, -3, 3, 0.25, v=>(v>=0?'+':'')+v+'%')}
        <button class="btn secondary" onclick="resetWhatIf()">Reset to baseline</button>
      </div>
      <div style="flex:1; min-width:280px;">
        <div class="subhead">Baseline</div>
        ${whatIfResultHTML(baseline)}
        <div class="divider"></div>
        <div class="subhead">With adjustments</div>
        <div id="whatIfResult">${whatIfResultHTML(current)}</div>
      </div>
    </div>
  </div>
  `;
}

      <thead><tr><th>Claim Age</th><th>Monthly Benefit</th><th>Annual Benefit</th></tr></thead>

      <div class="field"><label>Full Retirement Age (FRA)</label><input type="number" step="0.5" value="${ss.fra1}" onchange="update('socialSecurity.fra1', this.value); renderTab();"></div>
      <div class="field"><label>Planned claiming age</label><input type="number" step="0.5" min="62" max="70" value="${ss.claimAge1}" onchange="update('socialSecurity.claimAge1', this.value); renderTab(); renderClientList();"></div>
    </div>
    <div class="subhead">Claiming-Age Comparison</div>
    ${renderTable(table1, ss.claimAge1)}
    ${breakeven1 ? `<div style="margin-top:10px; font-size:12.5px; color:var(--ink-dim);">Breakeven age (claim 70 vs. 62): roughly age <strong>${breakeven1}</strong> — after that, delaying to 70 wins on cumulative lifetime benefit.</div>` : ''}
  </div>

  ${plan.household.hasClient2 ? `
  <div class="panel">
    <h2>Client 2</h2>
    <div class="row">
      <div class="field"><label>Primary Insurance Amount (monthly, at Full Retirement Age)</label><input type="number" value="${ss.pia2}" onchange="update('socialSecurity.pia2', this.value); renderTab();"></div>
      <div class="field"><label>Full Retirement Age (FRA)</label><input type="number" step="0.5" value="${ss.fra2}" onchange="update('socialSecurity.fra2', this.value); renderTab();"></div>
      <div class="field"><label>Planned claiming age</label><input type="number" step="0.5" min="62" max="70" value="${ss.claimAge2}" onchange="update('socialSecurity.claimAge2', this.value); renderTab(); renderClientList();"></div>

      <tbody>${plan.pensions.map((p,i)=>`
        <tr>
          <td><select class="compact" onchange="updatePension(${i},'owner',this.value)">
            <option value="client1" ${p.owner==='client1'?'selected':''}>Client 1</option>
            ${plan.household.hasClient2?`<option value="client2" ${p.owner==='client2'?'selected':''}>Client 2</option>`:''}
          </select></td>
          <td><input class="compact" type="number" value="${p.monthlyAmount}" onchange="updatePension(${i},'monthlyAmount',this.value)"></td>
          <td><input class="compact" type="number" value="${p.startAge}" onchange="updatePension(${i},'startAge',this.value)"></td>

    </table>
    <button class="addRowBtn" onclick="addPension()">+ Add pension</button>
  </div>

  <div class="note"><strong>Methodology:</strong> Uses the SSA's standard actuarial reduction/increase factors (5/9 of 1% per month for the first 36 months before FRA, 5/12 of 1% per month beyond that, and 2/3 of 1% per month of delayed retirement credit up to age 70). This is an estimate for planning conversations, not a substitute for the client's actual SSA benefit statement.</div>
  `;
}
function addPension(){ const plan=getPlan(activeId); plan.pensions.push({id:uid('pen'), owner:'client1', monthlyAmount:'', startAge:65}); renderTab(); }

        <div class="field"><label>Current savings (529, etc.)</label><input type="number" value="${g.currentSavings}" onchange="updateEducationGoal(${i},'currentSavings',this.value)"></div>
        <div class="field"><label>Current monthly contribution</label><input type="number" value="${g.monthlyContribution}" onchange="updateEducationGoal(${i},'monthlyContribution',this.value)"></div>
      </div>
      <div class="summary-cards">
        <div class="scard"><div class="label">Years Until College</div><div class="value">${proj.yearsUntilCollege}</div></div>
        <div class="scard"><div class="label">Future Total Cost</div><div class="value">${fmt$(proj.futureTotalCost)}</div></div>
        <div class="scard"><div class="label">Funding Gap (future $)</div><div class="value">${fmt$(proj.gap)}</div></div>
        <div class="scard ${shortfall>0?'bad':'good'}"><div class="label">Required Monthly Savings</div><div class="value">${fmt$(proj.requiredMonthly)}</div></div>
      </div>
      ${shortfall>0 ? `<div class="gap-flag over">Currently saving ${fmt$(proj.currentMonthlyContribution)}/mo — short by ${fmt$(shortfall)}/mo</div>` : `<div class="gap-flag aligned">Current contribution covers the projected gap</div>`}
    </div>`;
  }).join('') + `<button class="addRowBtn" onclick="addEducationGoal()">+ Add another education goal</button>
  <div class="note" style="margin-top:16px;"><strong>Methodology:</strong> Future cost assumes the entered education-cost inflation rate compounds through each year of college. Savings are assumed to grow at 6%/yr (a simplified 529-style blended-allocation assumption, not editable per-goal in this version). Required monthly savings solves for the ordinary-annuity payment that closes the gap by the time college starts.</div>`;
}

        <div class="pdf-notes">A three-asset-class (equity/bond/cash) Monte Carlo simulation with a glide path from the pre- to post-retirement equity weight on file, correlated annual returns (equity/bond mildly negatively correlated), and true lognormal per-year draws from the capital market assumptions on file. Guaranteed income (Social Security, pensions) is included starting in the actual year each benefit begins, not automatically at retirement. Does not model taxes beyond an optional flat withdrawal drag, Medicare or long-term-care costs, or Roth-conversion / tax-bracket sequencing. A directional planning signal, not a guarantee of future performance or outcome.</div>
      </div>
      <div class="pdf-section">
        <h3>Social Security</h3>
        <div class="pdf-notes">Estimates use the Social Security Administration's standard actuarial reduction and delayed-retirement-credit factors applied to the Primary Insurance Amount (PIA) entered. Not a substitute for the client's official SSA benefit statement.</div>
      </div>
      <div class="pdf-section">
        <h3>Insurance Needs</h3>
        <div class="pdf-notes">Life insurance need uses a simplified income-replacement plus debt plus final-expenses plus education approach, net of existing coverage — it does not net out liquid net worth or perform a full human-life-value calculation. Disability gap is monthly expenses minus existing benefit, without regard to elimination periods or benefit taxability.</div>
      </div>
      <div class="pdf-section">
        <h3>Education Funding</h3>
        <div class="pdf-notes">Future cost compounds the entered education-cost inflation rate through each year of college. Savings are assumed to grow at a blended 6%/yr. Required monthly savings solves for the ordinary-annuity payment needed to close the funding gap by the time college starts.</div>
      </div>
      <div class="pdf-sig-row">
        <div class="pdf-sig">Client acknowledges review of this plan &nbsp;&nbsp;&nbsp;&nbsp; Date</div>
        <div class="pdf-sig">Advisor &nbsp;&nbsp;&nbsp;&nbsp; Date</div>
      </div>
    </div>
  `;
}

function downloadPlanPDF(clientId){
  const plan = getPlan(clientId);
  $id('printArea').innerHTML = buildPlanPDF(clientId);
  window.print();
  if(plan){
    const mc = monteCarloResult(plan, {retireAgeDelta:0,spendingPct:100,savingsPct:100,returnDelta:0}, null, {seed:plan.monteCarlo.seed});
    plan.reportHistory = plan.reportHistory || [];
    plan.reportHistory.unshift({
      id: uid('rpt'), ts: Date.now(), user: currentUserEmail(),
      successRate: mc.successRate, medianEndingBalance: mc.medianEndingBalance,
      assumptionsSnapshot: JSON.parse(JSON.stringify(plan.assumptions)),
      trials: plan.monteCarlo.trials, seed: plan.monteCarlo.seed
    });
    if(plan.reportHistory.length>20) plan.reportHistory.length = 20;
    markDirty();
    forceSavePlan(clientId);
  }
}
window.addEventListener('afterprint', ()=>{ const p = $id('printArea'); if(p) p.innerHTML = ''; });

  tryAutoLogin();
});
</script>
